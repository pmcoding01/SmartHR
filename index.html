<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHR - ระบบบันทึกข้อมูลบุคลากรองค์กร</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config File -->
    <script src="config.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .pastel-gradient { background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 50%, #fef3c7 100%); }
        .soft-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="pastel-gradient min-h-screen text-slate-700 flex flex-col">

    <!-- Loader Overlay -->
    <div id="global-loader" class="fixed inset-0 bg-white/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-pink-400 border-t-transparent"></div>
            <p class="mt-3 text-sm font-medium text-pink-600">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen">
        <!-- Will be rendered dynamically via JS -->
    </div>

    <!-- LOGOUT MODAL -->
    <div id="logout-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 soft-shadow border border-pink-100 text-center">
            <div class="w-12 h-12 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="log-out" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-800">ยืนยันการออกจากระบบ</h3>
            <p class="text-sm text-slate-500 mt-1">คุณต้องการออกจากระบบใช่หรือไม่?</p>
            <div class="flex space-x-3 mt-6">
                <button onclick="closeLogoutModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-medium transition">ยกเลิก</button>
                <button onclick="confirmLogout()" class="flex-1 py-2.5 bg-pink-500 hover:bg-pink-600 text-white rounded-xl font-medium transition shadow-md shadow-pink-200">ออกจากระบบ</button>
            </div>
        </div>
    </div>

    <!-- ADMIN FLOATING PANEL (MOBILE) -->
    <div id="admin-mobile-panel" class="fixed bottom-20 left-4 right-4 bg-white/95 backdrop-blur-md rounded-2xl p-4 soft-shadow border border-pink-200 z-40 hidden md:hidden transition-all transform translate-y-4 opacity-0">
        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
            <span class="font-semibold text-pink-600 flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4"></i> เมนูผู้ดูแลระบบ</span>
            <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="switchTab('dashboard'); toggleAdminPanel();" class="p-3 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl text-sm font-medium flex items-center gap-2 transition"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> แดชบอร์ด</button>
            <button onclick="switchTab('employees'); toggleAdminPanel();" class="p-3 bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-xl text-sm font-medium flex items-center gap-2 transition"><i data-lucide="users" class="w-4 h-4"></i> จัดการพนักงาน</button>
            <button onclick="switchTab('users'); toggleAdminPanel();" class="p-3 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded-xl text-sm font-medium flex items-center gap-2 transition"><i data-lucide="user-cog" class="w-4 h-4"></i> จัดการผู้ใช้</button>
            <button onclick="exportCSVReport(); toggleAdminPanel();" class="p-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-xl text-sm font-medium flex items-center gap-2 transition"><i data-lucide="download" class="w-4 h-4"></i> ดาวน์โหลดรายงาน</button>
        </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script>
        // Initialize Supabase Client
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // App State
        let currentUser = JSON.parse(localStorage.getItem('smarthr_user')) || null;
        let currentTab = localStorage.getItem('smarthr_tab') || (currentUser ? 'dashboard' : 'landing');
        let employeesData = [];
        let usersData = [];
        let myProfileData = null;
        let salaryChartInstance = null;
        let deptChartInstance = null;

        // On Load
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderApp();
        });

        function showLoader(show) {
            const loader = document.getElementById('global-loader');
            if (show) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        }

        function switchTab(tab) {
            currentTab = tab;
            localStorage.setItem('smarthr_tab', tab);
            renderApp();
        }

        // --- RENDER ROUTER ---
        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!currentUser) {
                if (currentTab === 'login') {
                    app.innerHTML = renderLoginView();
                } else {
                    app.innerHTML = renderLandingView();
                }
            } else {
                // Logged in layout (Sidebar + Main Content)
                app.className = "flex-1 flex flex-col md:flex-row min-h-screen";
                app.innerHTML = `
                    <!-- Desktop Sidebar / Mobile Bottom Nav -->
                    ${renderSidebar()}
                    ${renderMobileBottomNav()}

                    <!-- Main Content Area -->
                    <main class="flex-1 p-4 md:p-6 pb-24 md:pb-6 overflow-y-auto">
                        ${renderHeaderBar()}
                        <div id="tab-content" class="mt-4">
                            ${renderTabContent()}
                        </div>
                    </main>
                `;
                initTabLogic();
            }
            lucide.createIcons();
        }

        // --- LANDING PAGE ---
        function renderLandingView() {
            return `
                <div class="min-h-screen flex flex-col justify-between p-6 md:p-12 w-full">
                    <header class="flex justify-between items-center max-w-6xl mx-auto w-full">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-pink-400 rounded-2xl flex items-center justify-center text-white soft-shadow">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xl font-bold text-slate-800">Smart<span class="text-pink-500">HR</span></span>
                        </div>
                        <button onclick="switchTab('login')" class="px-5 py-2.5 bg-pink-500 hover:bg-pink-600 text-white rounded-xl font-medium soft-shadow transition flex items-center gap-2">
                            <i data-lucide="log-in" class="w-4 h-4"></i> เข้าสู่ระบบ
                        </button>
                    </header>

                    <div class="max-w-4xl mx-auto text-center py-12">
                        <span class="px-4 py-1.5 bg-pink-100 text-pink-600 rounded-full text-sm font-medium inline-block mb-4">✨ ระบบจัดการข้อมูลบุคลากรยุคใหม่</span>
                        <h1 class="text-4xl md:text-6xl font-bold text-slate-800 leading-tight mb-6">
                            บริหารจัดการบุคลากรองค์กร <br><span class="text-pink-500">ง่าย รวดเร็ว และปลอดภัย</span>
                        </h1>
                        <p class="text-slate-600 text-lg mb-8 max-w-2xl mx-auto">
                            ระบบบันทึกข้อมูลพนักงานแบบ CRUD พร้อมแดชบอร์ดสรุปผลวิเคราะห์ และการกำหนดสิทธิ์ผู้ใช้งาน (Admin, HR, Employee) ดีไซน์น่ารัก ใช้งานง่ายทุกอุปกรณ์
                        </p>
                        <div class="flex justify-center gap-4">
                            <button onclick="switchTab('login')" class="px-8 py-3.5 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-semibold soft-shadow transition flex items-center gap-2 text-lg">
                                เริ่มต้นใช้งาน <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <footer class="text-center text-sm text-slate-500 py-4">
                        &copy; 2026 SmartHR System. Designed with Pastel Theme & Tailwind CSS.
                    </footer>
                </div>
            `;
        }

        // --- LOGIN VIEW (Fixed Center Alignment) ---
        function renderLoginView() {
            return `
                <div class="min-h-screen w-full flex items-center justify-center p-4">
                    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-8 max-w-md w-full soft-shadow border border-pink-100 my-auto">
                        <div class="text-center mb-6">
                            <div class="w-12 h-12 bg-pink-100 text-pink-500 rounded-2xl flex items-center justify-center mx-auto mb-3 soft-shadow">
                                <i data-lucide="lock" class="w-6 h-6"></i>
                            </div>
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800">เข้าสู่ระบบ SmartHR</h2>
                            <p class="text-xs md:text-sm text-slate-500 mt-1">กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งาน</p>
                        </div>

                        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs md:text-sm font-medium text-slate-600 mb-1">ชื่อผู้ใช้ (Username)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i data-lucide="user" class="w-4 h-4 md:w-5 md:h-5"></i></span>
                                    <input type="text" id="login-username" required class="w-full pl-9 md:pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm" placeholder="เช่น admin, hr, employee1">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs md:text-sm font-medium text-slate-600 mb-1">รหัสผ่าน (Password)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i data-lucide="key" class="w-4 h-4 md:w-5 md:h-5"></i></span>
                                    <input type="password" id="login-password" required class="w-full pl-9 md:pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm" placeholder="••••••••">
                                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                        <i id="eye-icon" data-lucide="eye" class="w-4 h-4 md:w-5 md:h-5"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="flex items-center justify-between text-xs md:text-sm">
                                <label class="flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" id="remember-me" class="rounded text-pink-500 focus:ring-pink-400 w-4 h-4">
                                    <span class="text-slate-600">จำรหัสผ่าน</span>
                                </label>
                                <button type="button" onclick="switchTab('landing')" class="text-pink-500 hover:underline">กลับหน้าแรก</button>
                            </div>

                            <button type="submit" class="w-full py-2.5 md:py-3 bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-xl soft-shadow transition text-sm">
                                เข้าสู่ระบบ
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('login-password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            showLoader(true);
            try {
                const { data, error } = await dbClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!');
                    showLoader(false);
                    return;
                }

                currentUser = data;
                localStorage.setItem('smarthr_user', JSON.stringify(currentUser));
                currentTab = currentUser.role === 'employee' ? 'my-profile' : 'dashboard';
                localStorage.setItem('smarthr_tab', currentTab);
                renderApp();
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการเข้าสู่ระบบ');
            } finally {
                showLoader(false);
            }
        }

        // --- NAVIGATION & LAYOUT ---
        function renderSidebar() {
            if (!currentUser) return '';
            const role = currentUser.role;
            return `
                <aside class="hidden md:flex flex-col w-60 bg-white/80 backdrop-blur-md border-r border-pink-100 p-5 sticky top-0 h-screen">
                    <div class="flex items-center space-x-3 mb-6">
                        <div class="w-9 h-9 bg-pink-400 rounded-xl flex items-center justify-center text-white soft-shadow">
                            <i data-lucide="users" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-slate-800 leading-tight text-base">Smart<span class="text-pink-500">HR</span></h1>
                            <span class="text-[10px] text-slate-400 uppercase tracking-wider">${currentUser.role} Role</span>
                        </div>
                    </div>

                    <nav class="space-y-1.5 flex-1">
                        ${role !== 'employee' ? `
                            <button onclick="switchTab('dashboard')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition ${currentTab === 'dashboard' ? 'bg-pink-500 text-white soft-shadow' : 'text-slate-600 hover:bg-pink-50'}">
                                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> แดชบอร์ดภาพรวม
                            </button>
                        ` : ''}
                        
                        ${role !== 'employee' ? `
                            <button onclick="switchTab('employees')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition ${currentTab === 'employees' ? 'bg-pink-500 text-white soft-shadow' : 'text-slate-600 hover:bg-pink-50'}">
                                <i data-lucide="users" class="w-4 h-4"></i> จัดการพนักงาน
                            </button>
                        ` : ''}

                        ${role === 'admin' ? `
                            <button onclick="switchTab('users')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition ${currentTab === 'users' ? 'bg-pink-500 text-white soft-shadow' : 'text-slate-600 hover:bg-pink-50'}">
                                <i data-lucide="user-cog" class="w-4 h-4"></i> จัดการผู้ใช้งาน
                            </button>
                        ` : ''}

                        ${role === 'employee' ? `
                            <button onclick="switchTab('my-profile')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition ${currentTab === 'my-profile' ? 'bg-pink-500 text-white soft-shadow' : 'text-slate-600 hover:bg-pink-50'}">
                                <i data-lucide="user" class="w-4 h-4"></i> ข้อมูลของฉัน
                            </button>
                        ` : ''}
                    </nav>

                    <div class="pt-3 border-t border-slate-100">
                        <button onclick="openLogoutModal()" class="w-full flex items-center gap-3 px-3.5 py-2.5 text-red-500 hover:bg-red-50 rounded-xl font-medium text-sm transition">
                            <i data-lucide="log-out" class="w-4 h-4"></i> ออกจากระบบ
                        </button>
                    </div>
                </aside>
            `;
        }

        function renderMobileBottomNav() {
            if (!currentUser) return '';
            const role = currentUser.role;
            const isAdmin = role === 'admin';

            return `
                <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-pink-100 px-4 py-2.5 flex justify-around items-center z-35">
                    ${role !== 'employee' ? `
                        <button onclick="switchTab('dashboard')" class="flex flex-col items-center ${currentTab === 'dashboard' ? 'text-pink-500' : 'text-slate-400'}">
                            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                            <span class="text-[10px] mt-1 font-medium">แดชบอร์ด</span>
                        </button>
                        <button onclick="switchTab('employees')" class="flex flex-col items-center ${currentTab === 'employees' ? 'text-pink-500' : 'text-slate-400'}">
                            <i data-lucide="users" class="w-5 h-5"></i>
                            <span class="text-[10px] mt-1 font-medium">พนักงาน</span>
                        </button>
                    ` : ''}

                    ${isAdmin ? `
                        <button onclick="toggleAdminPanel()" class="w-11 h-11 bg-pink-500 text-white rounded-full flex items-center justify-center soft-shadow -mt-5 border-4 border-white">
                            <i data-lucide="menu" class="w-5 h-5"></i>
                        </button>
                    ` : ''}

                    ${role === 'employee' ? `
                        <button onclick="switchTab('my-profile')" class="flex flex-col items-center ${currentTab === 'my-profile' ? 'text-pink-500' : 'text-slate-400'}">
                            <i data-lucide="user" class="w-5 h-5"></i>
                            <span class="text-[10px] mt-1 font-medium">ข้อมูลฉัน</span>
                        </button>
                    ` : ''}

                    <button onclick="openLogoutModal()" class="flex flex-col items-center text-red-400">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                        <span class="text-[10px] mt-1 font-medium">ออก</span>
                    </button>
                </div>
            `;
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-mobile-panel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                setTimeout(() => panel.classList.remove('translate-y-4', 'opacity-0'), 10);
            } else {
                panel.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => panel.classList.add('hidden'), 300);
            }
        }

        function renderHeaderBar() {
            return `
                <header class="flex justify-between items-center bg-white/80 backdrop-blur-md p-3.5 md:p-4 rounded-2xl soft-shadow border border-pink-100">
                    <div>
                        <h2 class="text-base md:text-lg font-bold text-slate-800">ยินดีต้อนรับ, ${currentUser.full_name}</h2>
                        <p class="text-[11px] text-slate-500">สถานะสิทธิ์: <span class="font-semibold uppercase text-pink-500">${currentUser.role}</span></p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center font-bold text-sm">
                            ${currentUser.full_name.charAt(0)}
                        </div>
                    </div>
                </header>
            `;
        }

        function openLogoutModal() {
            document.getElementById('logout-modal').classList.remove('hidden');
        }

        function closeLogoutModal() {
            document.getElementById('logout-modal').classList.add('hidden');
        }

        function confirmLogout() {
            localStorage.removeItem('smarthr_user');
            localStorage.removeItem('smarthr_tab');
            currentUser = null;
            currentTab = 'landing';
            closeLogoutModal();
            renderApp();
        }

        // --- TAB CONTENT ROUTER ---
        function renderTabContent() {
            if (currentUser.role === 'employee') {
                return renderMyProfileView();
            }
            if (currentTab === 'dashboard') return renderDashboardView();
            if (currentTab === 'employees') return renderEmployeesView();
            if (currentTab === 'users' && currentUser.role === 'admin') return renderUsersView();
            return renderDashboardView();
        }

        // --- 1. DASHBOARD VIEW (Compacted & Resized) ---
        async function fetchDashboardData() {
            showLoader(true);
            try {
                const { data, error } = await dbClient.from('employees').select('*');
                if (error) throw error;
                employeesData = data || [];
                updateDashboardUI();
            } catch (err) {
                console.error(err);
                alert('ไม่สามารถโหลดข้อมูลแดชบอร์ดได้');
            } finally {
                showLoader(false);
            }
        }

        function renderDashboardView() {
            setTimeout(fetchDashboardData, 50);
            return `
                <div class="space-y-4">
                    <!-- Stats Cards (Compact Size) -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="bg-white/90 p-4 rounded-2xl soft-shadow border border-pink-100 flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-100 text-blue-500 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="users" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs text-slate-500 font-medium truncate">พนักงานทั้งหมด</p>
                                <h3 id="stat-total-emp" class="text-base font-bold text-slate-800 truncate">0 คน</h3>
                            </div>
                        </div>

                        <div class="bg-white/90 p-4 rounded-2xl soft-shadow border border-pink-100 flex items-center space-x-3">
                            <div class="w-10 h-10 bg-pink-100 text-pink-500 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="wallet" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs text-slate-500 font-medium truncate">งบประมาณเงินเดือนรวม</p>

            employeesData.forEach(e => {

        // Image compression utility
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const MAX_HEIGHT = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.7);
                    };
                };
            });
        }

        async function saveEmployee(e) {
            e.preventDefault();
            showLoader(true);

            const dbId = document.getElementById('emp-db-id').value;
            const employee_id = document.getElementById('emp-id').value.trim();
            const full_name = document.getElementById('emp-name').value.trim();
            const department_position = document.getElementById('emp-dept').value.trim();
            const salary = parseFloat(document.getElementById('emp-salary').value);
            const phone = document.getElementById('emp-phone').value.trim();
            let image_url = document.getElementById('emp-image-url').value;

            const fileInput = document.getElementById('emp-image-file');
            if (fileInput.files.length > 0) {
                try {
                    const compressedBlob = await compressImage(fileInput.files[0]);
                    const fileName = `emp_${Date.now()}.jpg`;
                    const { data: uploadData, error: uploadError } = await dbClient.storage
                        .from('employee-avatars')
                        .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

                    if (uploadError) throw uploadError;
                    
                    const { data: publicURLData } = dbClient.storage
                        .from('employee-avatars')
                        .getPublicUrl(fileName);
                    
                    image_url = publicURLData.publicUrl;
                } catch (err) {
                    console.error('Upload Error:', err);
                    alert('อัปโหลดรูปภาพไม่สำเร็จ แต่จะดำเนินการบันทึกข้อมูลต่อ');
                }
            }

            const payload = { employee_id, full_name, department_position, salary, phone, image_url };

            try {
                let error;
                if (dbId) {
                    const res = await dbClient.from('employees').update(payload).eq('id', dbId);
                    error = res.error;
                } else {
                    const res = await dbClient.from('employees').insert([payload]);
                    error = res.error;
                }

                if (error) throw error;
                closeEmployeeModal();
                fetchEmployees();
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message);
            } finally {
                showLoader(false);
            }
        }

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

                                <select id="user-role" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
                                    <option value="employee">Employee</option>
                                    <option value="hr">HR</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                                <button type="button" onclick="closeUserModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs md:text-sm rounded-xl font-medium transition">ยกเลิก</button>
                                <button type="submit" class="px-4 py-2 bg-pink-500 hover:bg-pink-600 text-white text-xs md:text-sm rounded-xl font-medium transition shadow-md shadow-pink-200">บันทึก</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderUsersTable(data) {
            const tbody = document.getElementById('users-tbody');
            if (!tbody) return;
            tbody.innerHTML = data.map(u => `
                <tr class="hover:bg-pink-50/30 transition whitespace-nowrap">
                    <td class="p-3.5 font-semibold text-slate-800 whitespace-nowrap">${u.full_name}</td>
                    <td class="p-3.5 font-mono text-xs text-pink-600 whitespace-nowrap">${u.username}</td>
                    <td class="p-3.5 whitespace-nowrap"><span class="px-2.5 py-0.5 bg-pink-100 text-pink-600 rounded-full text-[10px] font-semibold uppercase">${u.role}</span></td>
                    <td class="p-3.5 text-center whitespace-nowrap">
                        <div class="flex items-center justify-center space-x-1.5">
                            <button onclick="editUser('${u.id}')" class="p-1.5 bg-blue-50 text-blue-500 hover:bg-blue-100 rounded-lg transition"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                            <button onclick="deleteUser('${u.id}')" class="p-1.5 bg-red-50 text-red-500 hover:bg-red-100 rounded-lg transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function openUserModal(user = null) {
            document.getElementById('user-modal-title').innerText = user ? 'แก้ไขข้อมูลผู้ใช้' : 'เพิ่มผู้ใช้งานระบบ';
            document.getElementById('user-db-id').value = user ? user.id : '';
            document.getElementById('user-fullname').value = user ? user.full_name : '';
            document.getElementById('user-username').value = user ? user.username : '';
            document.getElementById('user-password').value = user ? user.password : '';
            document.getElementById('user-role').value = user ? user.role : 'employee';
            document.getElementById('user-modal').classList.remove('hidden');
        }

        function closeUserModal() {
            document.getElementById('user-modal').classList.add('hidden');
        }

        async function saveUser(e) {
            e.preventDefault();
            showLoader(true);
            const dbId = document.getElementById('user-db-id').value;
            const full_name = document.getElementById('user-fullname').value.trim();
            const username = document.getElementById('user-username').value.trim();
            const password = document.getElementById('user-password').value.trim();
            const role = document.getElementById('user-role').value;

            const payload = { full_name, username, password, role };

            try {
                let error;
                if (dbId) {
                    const res = await dbClient.from('users').update(payload).eq('id', dbId);
                    error = res.error;
                } else {
                    const res = await dbClient.from('users').insert([payload]);
                    error = res.error;
                }

                if (error) throw error;
                closeUserModal();
                fetchUsers();
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                showLoader(false);
            }
        }

        function editUser(id) {
            const user = usersData.find(u => u.id === id);
            if (user) openUserModal(user);
        }

        async function deleteUser(id) {
            if (!confirm('คุณต้องการลบผู้ใช้นี้ใช่หรือไม่?')) return;
            showLoader(true);
            try {
                const { error } = await dbClient.from('users').delete().eq('id', id);
                if (error) throw error;
                fetchUsers();
            } catch (err) {
                console.error(err);
                alert('ลบผู้ใช้ไม่สำเร็จ');
            } finally {
                showLoader(false);
            }
        }

        // --- 4. MY PROFILE VIEW (Employee Role) ---
        async function fetchMyProfile() {
            showLoader(true);
            try {
                const { data, error } = await dbClient
                    .from('employees')
                    .select('*')
                    .ilike('full_name', `%${currentUser.full_name}%`)
                    .limit(1);

                if (data && data.length > 0) {
                    myProfileData = data[0];
                } else {
                    myProfileData = null;
                }
                updateMyProfileUI();
            } catch (err) {
                console.error(err);
            } finally {
                showLoader(false);
            }
        }

        function renderMyProfileView() {
            setTimeout(fetchMyProfile, 50);
            return `
                <div id="my-profile-container" class="max-w-md mx-auto bg-white/90 rounded-3xl p-6 soft-shadow border border-pink-100 space-y-4">
                    <div class="text-center">
                        <div class="w-20 h-20 rounded-full bg-slate-200 mx-auto mb-3 animate-pulse"></div>
                        <h3 class="text-xl font-bold text-slate-800">${currentUser.full_name}</h3>
                        <p class="text-xs text-pink-500 font-medium">Username: ${currentUser.username}</p>
                    </div>
                    <div class="bg-pink-50/50 rounded-2xl p-4 text-center text-xs text-slate-400">
                        กำลังโหลดข้อมูลพนักงาน...
                    </div>
                </div>
            `;
        }

        function updateMyProfileUI() {
            const container = document.getElementById('my-profile-container');
            if (!container) return;
            
            const myRecord = myProfileData;
            container.innerHTML = `
                <div class="text-center">
                    <img src="${myRecord?.image_url || 'https://via.placeholder.com/150?text=No+Image'}" onerror="this.src='https://via.placeholder.com/150?text=Error'" class="w-20 h-20 rounded-full object-cover mx-auto mb-3 border-4 border-pink-200 shadow-md" alt="Avatar">
                    <h3 class="text-xl font-bold text-slate-800">${currentUser.full_name}</h3>
                    <p class="text-xs text-pink-500 font-medium">Username: ${currentUser.username}</p>
                </div>

                <div class="bg-pink-50/50 rounded-2xl p-4 space-y-3 border border-pink-100 text-xs md:text-sm">
                    <div class="flex justify-between items-center border-b border-pink-100 pb-2">
                        <span class="text-slate-500">รหัสพนักงาน</span>
                        <span class="font-semibold text-slate-800 font-mono">${myRecord ? myRecord.employee_id : '-'}</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-pink-100 pb-2">
                        <span class="text-slate-500">แผนก / ตำแหน่ง</span>
                        <span class="font-semibold text-slate-800">${myRecord ? myRecord.department_position : 'ยังไม่ระบุในระบบพนักงาน'}</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-pink-100 pb-2">
                        <span class="text-slate-500">เงินเดือน</span>
                        <span class="font-semibold text-slate-800">${myRecord ? Number(myRecord.salary).toLocaleString() + ' บาท' : '-'}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500">เบอร์โทรศัพท์</span>
                        <span class="font-semibold text-slate-800">${myRecord ? myRecord.phone || '-' : '-'}</span>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function initTabLogic() {
            // Placeholder for tab specific inits
        }
    </script>
</body>
</html>
